name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (bash, -S warning)
        run: shellcheck --shell=bash --severity=warning bin/git-wt install.sh uninstall.sh tests/*.sh

  test:
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run tests/git-wt.test.sh
        run: bash tests/git-wt.test.sh
